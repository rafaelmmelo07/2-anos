<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Declaração - Carrossel Horizontal Infinito</title>
    <link rel="stylesheet" href="../style/nos.css">
</head>
<body>

    <header class="main-header">
        <div class="header-heart-center">
            <img src="../img/imagens decoraçao/coraçao.png" alt="Coração">
        </div>

        <div class="header-flex-container">
            <div id="header-line-left"></div>
            
            <div class="header-nav-center">
                <div class="header-buttons-wrapper">
                    <ol>
                        <li>
                            <a href="../declaracao.html">
                                <button class="btn-nav-custom">Declaração</button>
                            </a>
                        </li> 
                        <li>
                            <a href="../declaracao.html"> 
                                <button class="btn-nav-custom">Sobre</button>
                            </a>
                        </li>
                    </ol>
                </div>
            </div>
            
            <div id="header-line-right"></div>
        </div>
    </header>

    <main class="main-content">
        <div class="carousel-wrapper">
            <div class="carousel-track" id="track">
                <div class="slide"><img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=500&auto=format&fit=crop" alt="Foto 1"></div>
                <div class="slide"><img src="https://images.unsplash.com/photo-1634017839464-5c339ebe3cb4?w=500&auto=format&fit=crop" alt="Foto 2"></div>
                <div class="slide"><img src="https://images.unsplash.com/photo-1614850523459-c2f4c699c52e?w=500&auto=format&fit=crop" alt="Foto 3"></div>
                <div class="slide"><img src="https://images.unsplash.com/photo-1635070041078-e363dbe005cb?w=500&auto=format&fit=crop" alt="Foto 4"></div>
                <div class="slide"><img src="https://images.unsplash.com/photo-1604871000636-074fa5117945?w=500&auto=format&fit=crop" alt="Foto 5"></div>
            </div>
        </div>

        <div class="carousel-controls">
            <button class="control-btn" id="prevBtn">&#8592;</button>
            <button class="control-btn" id="nextBtn">&#8594;</button>
        </div>
    </main>

    <footer class="main-footer">
        <div class="footer-flex-container">
            <div id="footer-line-left"></div>
            
            <div id="footer-heart-center">
                <img src="../img/imagens decoraçao/coraçao.png" alt="Coração">
            </div>
            
            <div id="footer-line-right"></div>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
